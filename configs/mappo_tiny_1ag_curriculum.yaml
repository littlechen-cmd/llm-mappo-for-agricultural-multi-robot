device: auto

environment:
  size: tiny
  n_agvs: 1
  request_queue_size: 1
  picking_duration: 2
  max_steps: 100
  max_completed_tasks: 1
  terminate_on_death: false

model:
  local_radius: 3

planner:
  charge_threshold: 0.2
  plan_horizon: 20

prior:
  confidence: 0.9

reward:
  path_progress_scale: 0.05

mappo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  prior_coefficient: 0.1
  prior_mixing_coefficient: 0.8
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 128

training:
  seed: 42
  episodes: 2000
  planner_interval: 20
  prior_decay_episodes: 800
  log_interval: 20
  checkpoint_interval: 100
  checkpoint_path: artifacts/mappo_tiny_1ag_curriculum.pt
