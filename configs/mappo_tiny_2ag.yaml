device: auto

environment:
  size: tiny
  n_agvs: 2
  request_queue_size: 1
  max_steps: 100

model:
  local_radius: 3

planner:
  charge_threshold: 0.2
  plan_horizon: 20

mappo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 0.5
  update_epochs: 2
  minibatch_size: 64

training:
  seed: 42
  episodes: 20
  planner_interval: 10
  log_interval: 1
  checkpoint_interval: 20
  checkpoint_path: artifacts/mappo_tiny_2ag.pt
