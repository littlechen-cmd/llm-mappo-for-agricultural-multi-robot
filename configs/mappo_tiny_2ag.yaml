device: auto

environment:
  size: tiny
  n_agvs: 2
  request_queue_size: 1
  max_steps: 100
  picking_duration: 2
  allow_manual_unload: false

reward:
  path_progress_scale: 0.05
  time_penalty: 0.01
  load_bonus: 0.25
  picking_start_bonus: 0.25
  unload_penalty: 0.25

model:
  local_radius: 3

planner:
  charge_threshold: 0.2
  plan_horizon: 20

mappo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  prior_coefficient: 0.1
  prior_mixing_coefficient: 1.0
  max_grad_norm: 0.5
  update_epochs: 2
  minibatch_size: 64

training:
  seed: 42
  episodes: 100
  planner_interval: 10
  prior_warmup_episodes: 20
  prior_decay_episodes: 80
  prior_mixing_final: 0.0
  prior_kl_final_coefficient: 0.05
  actor_eval_interval: 20
  actor_eval_episodes: 5
  log_interval: 1
  checkpoint_interval: 20
  checkpoint_path: artifacts/mappo_tiny_2ag_200.pt
