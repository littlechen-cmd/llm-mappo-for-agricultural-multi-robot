device: auto

environment:
  size: tiny
  n_agvs: 2
  request_queue_size: 2
  picking_duration: 2
  max_steps: 100
  max_completed_tasks: 4
  terminate_on_death: false
  allow_manual_unload: false
  initial_battery: 10.0
  max_battery: 10.0
  safe_charge: 5.0

model:
  local_radius: 3

planner:
  charge_threshold: 2.0
  reserve_margin: 0.1
  plan_horizon: 20

prior:
  confidence: 1.0

reward:
  path_progress_scale: 0.05
  time_penalty: 0.01
  load_bonus: 0.25
  picking_start_bonus: 0.25
  unload_penalty: 0.25
  safe_charge: 5.0
  safe_charge_streak_steps: 10
  safe_charge_reward: 0.01

mappo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_coefficient: 0.5
  entropy_coefficient: 0.0
  prior_coefficient: 1.0
  prior_mixing_coefficient: 1.0
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 128

training:
  seed: 42
  episodes: 1200
  planner_interval: 20
  initial_actor_checkpoint: artifacts/mappo_tiny_1ag.pt
  prior_warmup_episodes: 300
  prior_decay_episodes: 900
  prior_mixing_final: 0.0
  prior_kl_final_coefficient: 1.0
  actor_eval_interval: 100
  actor_eval_episodes: 20
  log_interval: 20
  checkpoint_interval: 100
  checkpoint_path: artifacts/mappo_tiny_2ag_recovery.pt
  latest_checkpoint_path: artifacts/mappo_tiny_2ag_recovery_latest.pt

tensorboard:
  enabled: true
  log_dir: runs/mappo_tiny_2ag_recovery
  flush_secs: 15
  flush_interval: 20
