device: auto

environment:
  size: medium
  n_agvs: 1
  n_pickers: 2
  n_chargers: 1
  request_queue_size: 1
  picking_duration: 2
  max_steps: 400
  # Oracle throughput validation across held-out seeds shows 12 jobs is not
  # physically reachable for one AGV in 400 steps. Six preserves a nontrivial
  # task lifecycle while keeping the Phase 2 foundation solvable on medium.
  max_completed_tasks: 6
  terminate_on_death: false
  allow_manual_unload: false
  continuous_task_generation: false
  randomize_initial_requests: true
  initial_battery: 0.15
  max_battery: 10.0
  safe_charge: 5.0

dynamic_tasks:
  rate_per_step: 0.05
  max_pending_requests: 3
  policy_version: phase2-poisson-v1
  train_seed_start: 1000
  train_seed_count: 100
  heldout_seed_start: 2000
  heldout_seed_count: 20

oracle:
  charge_threshold: 0.10
  plan_horizon: 30

diagnostics:
  stalled_steps: 30

model:
  local_radius: 4
  include_phase2_features: true

prior:
  confidence: 1.0

reward:
  path_progress_scale: 0.05
  time_penalty: 0.01
  load_bonus: 0.25
  picking_start_bonus: 0.25
  unload_penalty: 0.25
  safe_charge: 5.0
  safe_charge_streak_steps: 10
  safe_charge_reward: 0.01
  low_battery_threshold: 0.10
  low_battery_penalty: 0.02
  collision_penalty: 0.10
  wait_streak_steps: 10
  wait_streak_penalty: 0.02

mappo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  prior_coefficient: 1.0
  prior_mixing_coefficient: 1.0
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 128
  diagnostic_metrics: true

training:
  seed: 314159
  episodes: 5000
  prior_warmup_episodes: 500
  prior_decay_episodes: 3000
  prior_mixing_final: 0.0
  prior_kl_final_coefficient: 0.0
  actor_eval_interval: 100
  actor_eval_episodes: 10
  log_interval: 20
  checkpoint_interval: 100
  checkpoint_path: artifacts/mappo_phase2_medium_1ag_oracle.pt
  latest_checkpoint_path: artifacts/mappo_phase2_medium_1ag_oracle_latest.pt
  diagnostics_path: artifacts/mappo_phase2_medium_1ag_training.json

tensorboard:
  enabled: true
  log_dir: runs/mappo_phase2_medium_1ag_oracle
  flush_secs: 15
  flush_interval: 20
